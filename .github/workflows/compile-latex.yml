name: Compile LaTeX

on:
  push:
    paths:
      - '**/*.tex'
      - '**/ejlnotes.cls'
      - '**/elmath.sty'
      - '**/myplainnat.bst'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            _algorithm/LLT.tex
            _validation/validation_report.tex
          latexmk_use_lualatex: false
          work_in_root_file_dir: true

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: |
            _algorithm/LLT.pdf
            _validation/validation_report.pdf