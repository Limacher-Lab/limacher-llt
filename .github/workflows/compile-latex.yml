name: Compile LaTeX

on:
  push:
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '**/.latexmkrc'
      - '**/ejlnotes.cls'
      - '**/elmath.sty'
      - '**/myplainnat.bst'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            _algorithm/LLT.tex
            _validation/validation_report.tex
          latexmk_use_lualatex: false
          work_in_root_file_dir: true

      - name: Commit updated PDFs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _algorithm/LLT.pdf _validation/validation_report.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Auto-compile LaTeX [skip ci]"
            git push
          fi

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: |
            _algorithm/LLT.pdf
            _validation/validation_report.pdf