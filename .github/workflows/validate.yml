name: Validate lifting-line solver

on:
  push:
    paths:
      - 'liftingline.py'
      - 'liftingline.m'
      - 'elliptic_AR8.txt'
      - 'thin_airfoil_data.txt'
      - '_tests/test_ci.py'
      - '_tests/test_ci.m'
      - '_validation/run_validation.py'
      - '_validation/run_validation.m'
      - '_validation/validation_report.tex'

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Run Python validation tests
        run: python _tests/test_ci.py

      - name: Run Python validation study
        run: python _validation/run_validation.py

      - name: Upload Python CSVs
        uses: actions/upload-artifact@v4
        with:
          name: python-validation-csvs
          path: _validation/validation_python_*.csv

  validate-matlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Octave
        run: sudo apt-get update && sudo apt-get install -y octave

      - name: Run MATLAB CI tests (via Octave)
        run: octave --no-gui --eval "cd('${GITHUB_WORKSPACE}'); run('_tests/test_ci.m');"

      - name: Run MATLAB validation study (via Octave)
        run: octave --no-gui --eval "cd('${GITHUB_WORKSPACE}'); run('_validation/run_validation.m');"

      - name: Upload MATLAB CSVs
        uses: actions/upload-artifact@v4
        with:
          name: matlab-validation-csvs
          path: _validation/validation_matlab_*.csv